services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ops_hub
      POSTGRES_PASSWORD: ops_hub_local
      POSTGRES_DB: ops_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_hub -d ops_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ops_hub:ops_hub_local@postgres:5432/ops_hub?schema=public
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-change-me}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  postgres-data:
  frontend-node-modules: